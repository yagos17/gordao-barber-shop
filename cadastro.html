<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <title>Cadastro | Gordão BarberShop</title>
</head>
<body>
    <nav class="navbar">
        <div class="nav__header">
            <div class="nav__logo"><a href="index.html">GORDÃO BARBERSHOP</a></div>
        </div>
        <ul class="nav__links">
            <li><a href="index.html">INÍCIO</a></li>
            <li><a href="login.html">ENTRAR</a></li>
        </ul>
    </nav>

    <main class="auth-page">
        <section class="auth-card">
            <p class="eyebrow">FAÇA PARTE</p>
            <h1>Crie sua conta.</h1>
            <p class="auth-description">Cadastre-se para reservar e acompanhar seus horários.</p>

            <form id="form-cadastro" class="auth-form">
                <div class="auth-field">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" autocomplete="name" placeholder="Seu nome" minlength="3" required>
                </div>

                <div class="auth-field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="auth-field">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" autocomplete="new-password" placeholder="Mínimo de 8 caracteres" minlength="8" required>
                </div>

                <div class="auth-field">
                    <label for="confirmar-senha">Confirmar senha</label>
                    <input type="password" id="confirmar-senha" name="confirmar-senha" autocomplete="new-password" placeholder="Digite a senha novamente" minlength="8" required>
                </div>

                <p id="auth-message" class="auth-message" role="alert" hidden></p>

                <button type="submit" class="btn auth-submit">CRIAR CONTA <i class="ri-arrow-right-line"></i></button>
            </form>

            <p class="auth-switch">Já possui uma conta? <a href="login.html">Entrar</a></p>
            <p class="auth-note">O cadastro público cria exclusivamente contas de cliente.</p>
        </section>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
