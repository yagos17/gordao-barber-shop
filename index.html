<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css">
    <title>Gordao BarberShop</title>
</head>

<body>
    <nav>
        <div class="nav__header">
            <div class="nav__logo">
                <a href="#">BARBERSHOP</a>
            </div>
            <div class="nav__menu__btn" id="menu-btn">
                <i class="ri-menu-line"></i>
            </div>
        </div>
        <ul class="nav__links" id="nav-links">
            <li><a href="#inicio">INÍCIO</a></li>
            <li><a href="#servicos">SERVIÇOS</a></li>
            <li><a href="#agendar">AGENDAR</a></li>
            <li><a href="#horarios">MEUS HORÁRIOS</a></li>
            <li><a href="#perfil">PERFIL</a></li>
            <li>
                <button class="btn">CADASTRAR-SE</button>
            </li>
        </ul>
    </nav>

    <header class="section__container hero__container" id="inicio">
        <div class="hero__content">
            <p class="section__subheader">BARBEARIA PREMIUM</p>
            <h1 class="hero__title">
                SEU ESTILO.<br />
                NO SEU TEMPO.
            </h1>
            <p class="hero__description">
                Cortes, barba e cuidados para quem valoriza a própria imagem.
            </p>
            <div class="hero__btn">
                <a href="#agendar" class="btn btn__primary">
                    AGENDAR HORÁRIO <i class="ri-arrow-right-line"></i>
                </a>
            </div>
            <div class="hero__features">
                <div class="feature__card">
                    <i class="ri-user-line"></i>
                    <span>Profissionais experientes</span>
                </div>
                <div class="feature__card">
                    <i class="ri-shield-check-line"></i>
                    <span>Ambiente seguro e confortável</span>
                </div>
                <div class="feature__card">
                    <i class="ri-star-line"></i>
                    <span>Qualidade em cada detalhe</span>
                </div>
            </div>
        </div>

        <div class="hero__image">
            <img src="assets/images/hero-barber.png" alt="Barbeiro cortando cabelo">
        </div>
    </header>

    <script src="js/script.js"></script>
</body>

</html>
